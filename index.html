<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12141a" id="metaTheme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalbėk">
<title>Kalbėk · Lithuanian Audio Dashboard</title>
<style>
:root{
  --bg:#12141a;--bg2:#171a22;--surface:#1b1f29;--surface2:#242936;--line:#2d3342;
  --text:#f1f3f8;--muted:#9aa3b5;--accent:#35c694;--accent-ink:#06261b;--glow:rgba(53,198,148,.22);
  --gold:#f5c542;--gold-text:#f5c542;--red:#ef5b5b;--green:#35c694;--danger:#ef5b5b;--shadow:0 10px 30px rgba(0,0,0,.35);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f5f3ec;--bg2:#efece2;--surface:#ffffff;--surface2:#f3f1ea;--line:#ddd8c8;
  --text:#1a1c22;--muted:#5d6475;--accent:#0b7a54;--accent-ink:#ffffff;--glow:rgba(11,122,84,.2);
  --gold:#b7860b;--gold-text:#8a6100;--red:#c1272d;--green:#0b7a54;--danger:#c1272d;--shadow:0 10px 26px rgba(40,35,10,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.45;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
body.has-np{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.skip-link{position:absolute;left:-999px;top:8px;background:var(--gold);color:#000;padding:8px 14px;border-radius:8px;z-index:200}
.skip-link:focus{left:8px}
.muted{color:var(--muted)}
.grow{flex:1}
small{font-size:.8em}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:7px 14px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem}
.logo-mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:.9rem;background:linear-gradient(160deg,#fdb913 0 34%,#006a44 34% 67%,#c1272d 67%)}
nav.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);padding:3px;border-radius:10px;margin-left:auto}
nav.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:.92rem}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs button:hover:not([aria-current="page"]){color:var(--text)}

main{max-width:1360px;margin:0 auto;padding:12px 14px 60px}
.btn{border:1px solid var(--line);background:var(--surface2);padding:7px 13px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.86rem}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;font-size:1rem;color:var(--muted);flex:none}
.icon-btn:hover:not(:disabled){background:var(--surface2);color:var(--text)}
.icon-btn[aria-pressed="true"]{color:var(--gold-text)}
.icon-btn.loop[aria-pressed="true"]{color:var(--accent);background:var(--glow)}
.chip{border:1px solid var(--line);background:var(--surface2);padding:3px 10px;border-radius:999px;font-size:.84rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}
button.chip:hover{border-color:var(--accent)}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);padding:7px 10px;border-radius:9px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--glow)}
textarea{resize:vertical;min-height:56px}
label.lbl{display:block;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
h2.sec{margin:0 0 10px;font-size:1.1rem}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:.8rem}
code.k{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.88em}

/* dictionary layout */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.side{position:sticky;top:58px;max-height:calc(100vh - 72px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.side h4{margin:10px 8px 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sitem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 9px;border-radius:7px;color:var(--text);font-size:.92rem}
.sitem:hover{background:var(--surface2)}
.sitem[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .ct{font-size:.76rem;opacity:.75;font-variant-numeric:tabular-nums}
.statline{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
.statline b{color:var(--text);font-size:1.05rem}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;display:flex;border:1px solid var(--line);min-width:110px;flex:1;max-width:260px}
.bar i{display:block;height:100%}
.bar .m{background:var(--green)}.bar .l{background:var(--gold)}.bar .n{background:var(--red);opacity:.6}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.search{position:relative;flex:1 1 220px}
.search input{padding-left:32px}
.search:before{content:"⌕";position:absolute;left:10px;top:3px;font-size:1.2rem;color:var(--muted)}
.toolbar select{width:auto;min-width:120px}
#catSel{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;color:var(--muted);font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:3px 11px;border-radius:999px;font-weight:600;color:var(--muted);font-size:.86rem}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.filters button em{font-style:normal;opacity:.75;margin-left:4px;font-size:.9em}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;margin-bottom:8px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:1px solid var(--gold);border-radius:10px}
.bulk select{width:auto}

/* items */
.items{display:flex;flex-direction:column;gap:3px}
.item{display:flex;align-items:center;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 11px;position:relative;min-height:42px;transition:border-color .15s,background .15s}
.item:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.item[data-status="1"]:before{background:var(--gold)}
.item[data-status="2"]:before{background:var(--green)}
.item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.item.sel{border-color:var(--gold)}
.item.current{border-color:var(--accent)}
.item.playing{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.pbtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:.8rem;flex:none;display:inline-grid;place-items:center}
.pbtn:hover{filter:brightness(1.1)}
.item .txt{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;cursor:pointer;padding:2px 0}
.item .lt{font-weight:700;font-size:1.05rem;word-break:break-word}
.item .en{color:var(--muted)}
.tag{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--bg2);border:1px solid var(--line);padding:1px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.dotbtn{border:0;background:transparent;font-size:.95rem;padding:4px 5px;border-radius:7px;flex:none}
.dotbtn:hover{background:var(--surface2)}
.pick{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.wave{display:none;gap:2px;align-items:center;height:16px}
.item.playing .wave,.clip.playing .wave{display:inline-flex}
.wave i{display:block;width:3px;height:4px;border-radius:2px;background:var(--accent);animation:bar .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:-.7s}.wave i:nth-child(3){animation-delay:-.3s}.wave i:nth-child(4){animation-delay:-.55s}
@keyframes bar{0%,100%{height:4px}50%{height:16px}}
.item .extra{flex-basis:100%;display:none;padding:6px 4px 6px 40px;border-top:1px dashed var(--line);margin-top:2px}
.item.open .extra{display:block}
.extra .ph{color:var(--muted);font-style:italic;font-size:.9rem;margin-bottom:6px}
.extra .xc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.approx{font-size:.68rem;border:1px solid var(--line);border-radius:5px;padding:0 4px;font-style:normal;margin-left:4px}
.items.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.items.cards .item{align-content:flex-start;padding:8px 10px 6px 12px}
.items.cards .txt{flex-basis:100%;order:-1;flex-direction:column;gap:0}
.items.cards .item .lt{font-size:1.25rem}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty b{display:block;font-size:1.15rem;color:var(--text);margin-bottom:6px}
.steps{display:inline-block;text-align:left;margin:10px 0 16px;line-height:1.9}

/* now playing */
.np{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.25)}
.np-in{max-width:1360px;margin:0 auto;padding:7px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.np-title{min-width:140px;max-width:300px;line-height:1.2}
.np-title b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-title span{font-size:.8rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np input[type=range]{flex:1 1 160px;accent-color:var(--accent);min-width:100px}
.np .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;min-width:80px;text-align:center}

/* practice */
.pr-wrap{max-width:720px;margin:0 auto}
.pr-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr-form .full{grid-column:1/-1}
.pr-prog{height:7px;background:var(--surface);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.pr-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pr-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:var(--shadow)}
.pr-big-play{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:2.2rem;display:grid;place-items:center;box-shadow:0 8px 28px var(--glow)}
.pr-big-play.playing{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 20px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pr-lt{font-size:2.1rem;font-weight:800;line-height:1.2}
.pr-en{font-size:1.3rem}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;width:100%}
.rate button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 4px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.rate button small{font-weight:500;color:var(--muted)}
.rate .r-again:hover{border-color:var(--red)}.rate .r-hard:hover{border-color:var(--gold)}.rate .r-good:hover,.rate .r-easy:hover{border-color:var(--green)}
.stat-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.stat-mini div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px}
.stat-mini b{display:block;font-size:1.4rem}

/* lessons */
.drop{border:2px dashed var(--line);border-radius:14px;padding:30px 18px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.lsn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:5px}
.lsn b{flex:1 1 220px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsn .meta{color:var(--muted);font-size:.86rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:9px}
.row b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-rows{display:flex;flex-direction:column;gap:5px;max-height:360px;overflow:auto}

/* workbench */
.wb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.wb-head input.title{font-size:1.1rem;font-weight:700;flex:1 1 260px;max-width:520px}
.wb-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:10px}
.wb-tools .panel{padding:10px 12px}
.wb-tools h3{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wb-tools .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.wb-tools input[type=range]{accent-color:var(--accent);width:130px}
.wb-tools select{width:auto}
.prog{height:6px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.clips{display:flex;flex-direction:column;gap:2px}
.clip{display:grid;grid-template-columns:28px 32px 62px 74px minmax(0,1fr) 30px 30px 18px;gap:6px;align-items:center;padding:3px 8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;position:relative}
.clip.playing{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.clip.skip{opacity:.5}
.clip .num{color:var(--muted);font-size:.8rem;text-align:right}
.clip .tm{font-size:.82rem;font-variant-numeric:tabular-nums;line-height:1.1}
.clip .tm small{display:block;color:var(--muted)}
.clip select{padding:4px 6px;font-weight:700;font-size:.85rem}
.clip.lt select{color:var(--green)}.clip.en select{color:var(--gold-text)}
.clip input[type=text]{padding:5px 9px}
.clip .pair{grid-column:5;font-size:.78rem;color:var(--muted);margin-top:-2px;padding-left:4px}
.clip .added{color:var(--green);font-weight:800}
.wb-foot{position:sticky;bottom:0;z-index:20;margin-top:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.22)}
body.has-np .wb-foot{bottom:68px}

/* modal / toast */
.modal-ov{position:fixed;inset:0;z-index:100;background:rgba(5,7,12,.62);backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{max-width:1000px}
.modal-head{padding:14px 18px 4px;display:flex;align-items:center;gap:10px}
.modal-head h2{margin:0;font-size:1.15rem;flex:1}
.modal-body{padding:8px 18px;overflow:auto}
.modal-foot{padding:12px 18px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.charpad{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.charpad button{min-width:32px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.charpad button:hover{border-color:var(--accent)}
.rv-row{display:grid;grid-template-columns:28px 1.1fr 1.3fr 1.3fr 1fr 1.4fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rv-row.head{font-size:.72rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.05em;position:sticky;top:0;background:var(--surface);z-index:1}
.rv-file{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-row.dim input[type=text]{opacity:.45}
#toasts{position:fixed;right:14px;bottom:14px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
body.has-np #toasts{bottom:88px}
.toast{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--accent);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:380px;animation:tin .25s}
.toast.warn{border-left-color:var(--gold)}.toast.err{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#dropveil{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(10,40,30,.8);color:#fff;font-size:1.5rem;font-weight:800;border:4px dashed var(--accent);pointer-events:none}
.help-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}

/* ---- waveform editor ---- */
.wvp{padding:10px 12px;margin-bottom:10px}
.wvp h3{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wv-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.wv-bar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.wv-bar .btn:disabled{opacity:.4;cursor:default}
.wv-canvas{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
#wvMain{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair;outline-offset:-3px}
#wvMini{display:block;width:100%;height:36px;touch-action:none;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);cursor:pointer}
.wv-info{margin:6px 0 8px;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.3em}
.clip.sel{box-shadow:inset 3px 0 0 var(--gold)}
@media (max-width:600px){#wvMain{height:140px}.wv-bar .btn{min-height:36px}.wv-bar.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.wv-bar.scroll>*{flex:none}}
/* ---- polish: safe areas, dynamic viewport, touch, mobile inputs ---- */
body{min-height:100dvh}
.modal{max-height:92dvh}
.top-in,.np-in{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.np{padding-bottom:env(safe-area-inset-bottom)}
.clip .pair:empty{display:none}
@media (pointer:coarse){
  .icon-btn{width:44px;height:44px}

const $ = (s, r = document) => r.querySelector(s);

/* ===================================================================

=================================================================== */
let db = null; const mem = new Map(); const urls = new Map();

/* ===================================================================

function phonWord(w) {
  w = stripStress(w.toLowerCase()); const u = [];
  for (let i = 0; i < w.length;) {
    const two = w.slice(i, i + 2);

    <div class="panel"><h2 class="sec">Erase everything</h2><p class="muted" style="margin-top:0">Deletes all phrases, lessons, stored audio and progress from this browser.</p><button class="btn danger" id="btnWipe">Erase everything…</button></div></div>`;
  $('#btnExport').onclick = exportJSON; $('#btnJson').onclick = () => $('#fileJson').click();
  $('#expAudio').onchange = () => { const x = $('#expLessons'); x.disabled = !$('#expAudio').checked; if (x.disabled) x.checked = false; };

}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportJSON() {
  const withAudio = $('#expAudio').checked, btn = $('#btnExport'); btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const base = { app: 'lithuanian-audio-dashboard', version: 2, exported: new Date().toISOString(), entries: state.entries, lessons: state.lessons, days: state.days, settings: state.settings };
    const head = JSON.stringify(base), parts = [];
    if (!withAudio) parts.push(head);
    else {
      parts.push(head.slice(0, -1) + ',"audio":{'); const names = new Map(); state.entries.forEach(e => e.audioId && names.set(e.audioId, e.audioName)); if ($('#expLessons').checked) state.lessons.forEach(l => l.audioId && !names.has(l.audioId) && names.set(l.audioId, l.name)); let first = true;
      for (const [id, name] of names) { const b = await getBlob(id); if (!b) continue; parts.push((first ? '' : ',') + JSON.stringify(id) + ':' + JSON.stringify({ name, type: b.type, data: await blobToDataURL(b) })); first = false; }
      parts.push('}}');
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parts, { type: 'application/json' }));
    a.download = 'lithuanian-dashboard-' + todayStr() + (withAudio ? '-with-audio' : '') + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    state.lastExport = Date.now(); save(); toast('Backup downloaded.');

$('#fileJson').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJSONFile(f); };
async function importJSONFile(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { toast('That file is not valid JSON.', 'err'); return; }
  if (!data || !Array.isArray(data.entries)) { toast('This does not look like a dashboard backup.', 'err'); return; }
  const n = data.entries.length, nl = (data.lessons || []).length, hasA = data.audio ? Object.keys(data.audio).length : 0;
  const m = openModal(`<div class="modal-head"><h2>Import backup</h2></div><div class="modal-body"><p>Found <b>${n}</b> phrase${n === 1 ? '' : 's'}, <b>${nl}</b> lesson${nl === 1 ? '' : 's'}${hasA ? ` and <b>${hasA}</b> audio file${hasA === 1 ? '' : 's'}` : ''}.</p>
    <p class="muted"><b>Merge</b> keeps what you have and adds/updates from the file. <b>Replace</b> discards everything stored now.</p></div>
    <div class="modal-foot"><button class="btn" data-x>Cancel</button><button class="btn danger" data-mode="replace">Replace all</button><button class="btn primary" data-mode="merge">Merge</button></div>`);
  m.el.addEventListener('click', async ev => {
    if (ev.target.closest('[data-x]')) return m.close(); const b = ev.target.closest('[data-mode]'); if (!b) return; b.disabled = true; b.textContent = 'Importing…';
    try { await applyImport(data, b.dataset.mode); toast('Backup imported.'); } catch (err) { console.error(err); toast('Import failed: ' + err.message, 'err'); } m.close();

}
async function applyImport(data, mode) {
  stopAudio(); lv.open = null; wb = null;
  if (mode === 'replace') { const ids = new Set(); state.entries.forEach(e => e.audioId && ids.add(e.audioId)); state.lessons.forEach(l => l.audioId && ids.add(l.audioId)); state.entries = []; state.lessons = []; state.days = {}; for (const id of ids) await deleteAudio(id); }
  for (const [id, a] of Object.entries(data.audio || {})) { if (!a || !a.data) continue; const blob = await (await fetch(a.data)).blob(); mem.set(id, new Blob([blob], { type: a.type || blob.type || 'audio/mpeg' })); await idbPut(id, mem.get(id)); }
  for (const il of (data.lessons || []).map(mkLesson)) { const ex = lessonById(il.id) || state.lessons.find(l => l.name && l.name === il.name); if (ex) { const keep = ex.audioId; Object.assign(ex, il, { id: ex.id, audioId: keep || il.audioId }); } else state.lessons.push(il); }
  for (const inc of data.entries.filter(e => e && (e.lt || e.stress)).map(mkEntry)) {
    const t = state.entries.find(e => e.id === inc.id) || state.entries.find(e => key(stripStress(e.lt)) === key(stripStress(inc.lt)) && e.cat === inc.cat);
    if (t) { const keep = { id: t.id, audioId: t.audioId || inc.audioId, audioName: t.audioName || inc.audioName }; if (t.audioId) Object.assign(keep, { clip: t.clip, s0: t.s0, s1: t.s1, t0: t.t0, t1: t.t1 }); Object.assign(t, inc, keep); } else state.entries.push(inc);
  }

  if (mode === 'replace' && data.settings) state.settings = Object.assign({ theme: null, view: 'list', asr: 'base' }, data.settings);
  await verifyAudioRefs(); applyTheme(); save(); refresh();
}
async function verifyAudioRefs() {
  if (!db) { state.entries.forEach(e => { if (!mem.has(e.audioId)) { e.audioId = null; } }); state.lessons.forEach(l => { if (!mem.has(l.audioId)) l.audioId = null; }); return; }
  const keys = new Set((await idb('readonly', s => s.getAllKeys()).catch(() => [])) || []); mem.forEach((_, k) => keys.add(k)); let lost = 0;
  state.entries.forEach(e => {
    if (!e.audioId || keys.has(e.audioId)) return; const ls = e.lessonId && lessonById(e.lessonId);
    if (e.clip && ls && ls.audioId && keys.has(ls.audioId) && e.s0 != null) { e.audioId = ls.audioId; e.audioName = ls.name; e.clip = false; e.t0 = e.s0; e.t1 = e.s1; return; }   // cut file missing: fall back to the lesson file
    e.audioId = null; lost++; if (e.clip && ls) { e.t0 = e.s0; e.t1 = e.s1; } else if (!ls) e.t0 = e.t1 = null; e.clip = false; e.s0 = e.s1 = null;
  });
  state.lessons.forEach(l => { if (l.audioId && !keys.has(l.audioId)) { l.audioId = null; lost++; } });
  const used = new Set(); state.entries.forEach(e => e.audioId && used.add(e.audioId)); state.lessons.forEach(l => l.audioId && used.add(l.audioId));
  for (const k of keys) if (!used.has(k)) { await idbDel(k); mem.delete(k); }
  return lost;
}

/* ===================================================================
   Tabs, theme, help, keyboard
=================================================================== */
function showTab(name, keepLesson) {
  if (pr.active && name !== 'practice') { pr.active = false; stopAudio(); }
  if (name !== 'lessons' && wb) { /* keep decoded audio while browsing other tabs */ }
  tab = name; $$('.tab').forEach(s => s.hidden = s.id !== 'tab-' + name);
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === name ? 'page' : 'false'));
  if (name === 'practice') renderPractice(); if (name === 'lessons') { if (!keepLesson && !wb) lv.open = null; renderLessons(); }
  if (name === 'backup') renderBackup(); if (name === 'dict') { renderStats(); renderChips(); renderList(); }
  window.scrollTo({ top: 0 });
}
$$('nav.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab, b.dataset.tab === 'lessons' && !!wb));
function applyTheme() {
  const th = state.settings.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = th;
  const mt = $('#metaTheme'); if (mt) mt.content = th === 'light' ? '#f5f3ec' : '#12141a';
}
$('#btnTheme').onclick = () => { state.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); };
function openHelp() {
  const m = openModal(`<div class="modal-head"><h2>Keyboard shortcuts</h2><button class="icon-btn" data-x aria-label="Close">✕</button></div><div class="modal-body">
    <h3 style="margin:6px 0">Dictionary</h3><div class="help-grid">
    <span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd></span><span>Move between phrases</span><span><kbd>Space</kbd></span><span>Play / pause</span><span><kbd>R</kbd> <kbd>S</kbd> <kbd>L</kbd></span><span>Replay · speed · loop</span>
    <span><kbd>Enter</kbd></span><span>Show / hide details &amp; notes</span><span><kbd>E</kbd></span><span>Edit phrase</span><span><kbd>F</kbd> <kbd>M</kbd></span><span>Favorite · cycle mastery</span>
    <span><kbd>N</kbd></span><span>New phrase</span><span><kbd>/</kbd></span><span>Search</span></div>
    <h3 style="margin:14px 0 6px">Lesson workbench</h3><div class="help-grid"><span><kbd>Enter</kbd> in a text box</span><span>Next clip + play it (<kbd>Shift</kbd>+<kbd>Enter</kbd> = previous)</span></div>
    <h3 style="margin:14px 0 6px">Waveform editor (Lessons)</h3><div class="help-grid"><span>Drag a handle</span><span>Move where a clip starts / ends</span><span><kbd>←</kbd> <kbd>→</kbd></span><span>Previous / next clip</span><span><kbd>Space</kbd></span><span>Play the selected clip</span><span><kbd>S</kbd></span><span>Split at the cursor</span><span><kbd>Del</kbd></span><span>Delete the clip</span><span><kbd>Ctrl</kbd>+<kbd>Z</kbd></span><span>Undo (add <kbd>Shift</kbd> to redo)</span><span><kbd>Ctrl</kbd>+scroll</span><span>Zoom</span></div>
    <h3 style="margin:14px 0 6px">Practice</h3><div class="help-grid"><span><kbd>Space</kbd></span><span>Play / replay</span><span><kbd>Enter</kbd></span><span>Reveal</span><span><kbd>1</kbd>–<kbd>4</kbd></span><span>Again · Hard · Good · Easy</span><span><kbd>Esc</kbd></span><span>End session</span></div></div>
    <div class="modal-foot"><button class="btn primary" data-x>Got it</button></div>`);
  m.el.addEventListener('click', ev => { if (ev.target.closest('[data-x]')) m.close(); });

$('#btnHelp').onclick = openHelp;
document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const t = ev.target, typing = t.matches && t.matches('input:not([type=checkbox]):not([type=range]),textarea,select,[contenteditable]');
  if (modals.length) { if (ev.key === 'Escape') { ev.preventDefault(); closeTopModal(); } return; }
  if (tab === 'practice' && pr.active) {
    if (typing) return; const k = ev.key;
    if (k === ' ') { ev.preventDefault(); const e = byId(pr.queue[pr.i]); if (e) replay(e.id); } else if (k === 'Enter') { ev.preventDefault(); reveal(); }
    else if (['1', '2', '3', '4'].includes(k)) { ev.preventDefault(); rateCard(['again', 'hard', 'good', 'easy'][+k - 1]); } else if (k === 'Escape') { ev.preventDefault(); endSession(); } return;
  }
  if (typing) { if (ev.key === 'Escape') t.blur(); return; }
  if (ev.key === '?') { ev.preventDefault(); openHelp(); return; }
  if (tab !== 'dict') return;
  if (ev.key === '/') { ev.preventDefault(); $('#q').focus(); return; }
  const onBtn = t.closest && t.closest('button,a,summary,input'); const items = $$('#list .item'); if (!items.length) return;
  let idx = items.findIndex(c => c.dataset.id === ui.sel); if (idx < 0) idx = 0;
  const move = d => { ev.preventDefault(); selectItem(items[Math.min(items.length - 1, Math.max(0, idx + d))].dataset.id); };
  switch (ev.key) {
    case 'ArrowRight': return move(1); case 'ArrowLeft': return move(-1);
    case 'ArrowDown': return move(listCols()); case 'ArrowUp': return move(-listCols());
    case 'Home': return move(-idx); case 'End': return move(items.length);
  }
  if (onBtn && (ev.key === ' ' || ev.key === 'Enter')) return;
  const e = byId(ui.sel); if (!e) return;
  switch (ev.key.toLowerCase()) {
    case ' ': ev.preventDefault(); playEntry(e.id); break; case 'enter': ev.preventDefault(); toggleOpen(e); break;
    case 'r': replay(e.id); break; case 's': cycleSpeed(e.id); break; case 'l': toggleLoop(e.id); break;
    case 'f': toggleFav(e); break; case 'm': cycleStatus(e); break; case 'e': ev.preventDefault(); openEdit(e.id); break; case 'n': ev.preventDefault(); openEdit(null); break;
  }

document.addEventListener('keyup', ev => { if (ev.key === ' ' && tab === 'practice' && pr.active && !(ev.target.matches && ev.target.matches('input,textarea,select'))) ev.preventDefault(); });

/* ===================================================================
   PWA: install prompt, service worker, storage status
=================================================================== */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function syncInstallButtons() {
  const show = !!installEvt && !isStandalone();
  ['btnInstall', 'btnInstall2'].forEach(id => { const b = $('#' + id); if (b) b.hidden = !show; });
}
async function doInstall() {
  if (!installEvt) return; installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; syncInstallButtons();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; syncInstallButtons(); });
window.addEventListener('appinstalled', () => { installEvt = null; syncInstallButtons(); toast('App installed.'); });
$('#btnInstall').onclick = doInstall;
async function renderStorageInfo() {
  syncInstallButtons();
  const info = $('#storeInfo'); if (!info) return;
  const b2 = $('#btnInstall2'); if (b2) b2.onclick = doInstall;
  if (!navigator.storage || !navigator.storage.estimate) { info.textContent = 'Storage details are not available in this browser.'; return; }
  try {
    const est = await navigator.storage.estimate(), pers = navigator.storage.persisted ? await navigator.storage.persisted() : null;
    const el = $('#storeInfo'); if (!el) return;
    el.innerHTML = `Using <b>${fmtBytes(est.usage || 0)}</b>${est.quota ? ' of about ' + fmtBytes(est.quota) : ''} · ` +
      (pers ? '<b style="color:var(--green)">protected from automatic clean-up</b>' : '<b style="color:var(--gold-text)">not protected</b> — the browser may clear it if the device runs low on space') +
      (isStandalone() ? ' · running as an installed app' : '');
    const bp = $('#btnPersist'); if (bp) { bp.hidden = pers !== false; bp.onclick = async () => { const ok = await navigator.storage.persist().catch(() => false); toast(ok ? 'Your data is now protected.' : 'The browser declined. Installing the app usually helps.', ok ? '' : 'warn'); renderStorageInfo(); }; }
  } catch (e) { info.textContent = 'Could not read storage details.'; }
}
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered', err));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) toast('A new version of the app is ready — reload to use it.', 'warn'); });
}

/* ===================================================================
   Init
=================================================================== */
(async function init() {
  loadState(); applyTheme(); const ok = await openDB();
  if (loadWarning) toast(loadWarning, 'err');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  if (!ok) toast('Browser storage for audio is unavailable here — MP3s will only last for this session.', 'warn');
  const lost = await verifyAudioRefs(); if (lost) { toast(lost + ' audio file(s) were missing from browser storage — re-attach them in the Lessons tab.', 'warn'); }
  saveNow(); if ('speechSynthesis' in window) speechSynthesis.getVoices();
  renderStats(); renderChips(); renderList();
  try { lastSaved = localStorage.getItem(LS_KEY); } catch (e) {}
  registerSW();
})();
})();
